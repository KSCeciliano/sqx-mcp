[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "sq-mcp"
version = "0.4.9"
description = "MCP server + Claude Code plugin for native interaction with StrategyQuant X. Drive backtests, monitor builds in real time, audit strategies, and orchestrate portfolios from any MCP client."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "sq-mcp contributors" }]
keywords = ["mcp", "strategyquant", "trading", "algotrading", "claude", "backtesting"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "mcp[cli]>=1.13.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "lxml>=5.2.0",
    "jsonschema>=4.22.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
]

[project.scripts]
sq-mcp = "sq_mcp.__main__:main"

[project.urls]
Homepage = "https://github.com/DAVIDAROCA27/sqx-mcp"
Issues = "https://github.com/DAVIDAROCA27/sqx-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/sq_mcp"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = [
    "sq_mcp.tools._numerics",
    "sq_mcp.tools.ratios",
    "sq_mcp.tools.tail_risk",
    "sq_mcp.tools.stats_extra",
    "sq_mcp.tools.overfit_diag",
]
disallow_untyped_defs = true
